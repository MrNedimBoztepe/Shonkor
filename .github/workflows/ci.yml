name: CI

on:
  # `develop` is the integration branch — every feature PR targets it, so it MUST be covered here.
  # It was not (#209): the filters named only `main`, so CI ran when develop was promoted to main and
  # never on the PRs that actually introduced the code. Every feature branch merged with no checks at all,
  # which quietly voided the guarantee #182 established (that a Linux runner exercises the file-symlink
  # containment escape). A gate that does not run on the change is not a gate.
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      linux-runner:
        description: 'Runner for the Linux leg of Build & Test'
        type: choice
        default: ubuntu-latest
        options:
          - ubuntu-latest
          - self-hosted

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege for the default GITHUB_TOKEN: this workflow only builds and tests, so it needs to read
# the repo and nothing else. Without an explicit block the token inherits the repo/org default, which can be
# read/write (actions/missing-workflow-permissions). Declared at the top so every job inherits it.
permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.name }})
    # BOTH platforms, every run (#209). Path containment is a SECURITY guard whose two halves are
    # platform-specific, and only one of them was ever tested by CI:
    #   * Linux  — file symlinks need no privilege, so the file-symlink escape (#104) runs for real here.
    #              On Windows it must skip, because a file symlink needs Developer Mode/admin (#182).
    #   * Windows — junctions, drive-letter paths, and the case-INSENSITIVE path comparison that
    #              TryResolveContainedPath depends on. None of that is exercised on Linux at all.
    # Running one platform and inferring the other is precisely the assumption #182 was filed to kill.
    strategy:
      fail-fast: false # a Windows-only break must not hide a Linux-only one, and vice versa
      matrix:
        include:
          # The Linux leg keeps the self-hosted override: it is the leg that was always GitHub-hosted, and
          # moving it to the local runner is the documented escape hatch.
          - name: linux
            runner: ${{ inputs.linux-runner || vars.CI_RUNNER || 'ubuntu-latest' }}
          - name: windows
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Shonkor.slnx

      - name: Build (Release)
        run: dotnet build Shonkor.slnx --configuration Release --no-restore

      - name: Test (with the expected-error marker gate, #255)
        shell: bash
        run: |
          # Capture the run so the marker gate can scan it, without losing dotnet test's exit code.
          dotnet test tests/Shonkor.Tests/Shonkor.Tests.csproj --configuration Release --no-build --verbosity normal 2>&1 | tee test-output.log
          test_rc=${PIPESTATUS[0]}
          # Fail the job if a deliberate error was logged without an [EXPECTED ERROR] marker (#236/#255).
          bash scripts/gate-expected-errors.sh test-output.log || exit 1
          # A real test failure must still fail the job even when the gate is happy.
          exit "$test_rc"

  docker-image:
    name: Docker image
    # The Dockerfile was exercised by NOTHING until #388: CD only runs on push to `main`, and `main` had not
    # moved for two weeks — so a restore layer that could not publish the TypeScript plugin, and an image
    # silently shipping the SQLite build affected by CVE-2025-6965, both stayed invisible. CI builds the
    # solution directly and never touched the Dockerfile. This job closes that hole: the image is built on
    # every PR, without pushing.
    # No path filter on purpose: the CVE regression came from Directory.Build.props, and the last CD run
    # built AND pushed the image in 91 s with the GHA cache — a build without push is not worth filtering.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true # keep the image in the local daemon so the smoke check below can run it
          tags: shonkor:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke — the image carries the pinned native SQLite, not the vulnerable transitive one
        shell: bash
        run: |
          # #389: every image published between 2026-06-22 and 2026-07-16 shipped
          # SQLitePCLRaw.lib.e_sqlite3 2.1.11 (CVE-2025-6965) while local and CI builds got the pinned
          # 3.50.3 — because Dockerfile's restore layer did not copy Directory.Build.props, which carries
          # BOTH the pin and the TreatWarningsAsErrors that escalates NU1903. #388 put the file back.
          #
          # This check deliberately does NOT look at the build log. A restore layer can be a cache hit, and
          # then the log shows neither the warning nor the resolved version — an absent step reads exactly
          # like an absent problem. It asks the finished artifact what it contains instead.
          #
          # The expected version is read from Directory.Build.props rather than written here, so a bump has
          # one place to happen and this check cannot drift into asserting yesterday's pin.
          pin=$(grep -oE 'SQLitePCLRaw\.lib\.e_sqlite3" Version="[0-9.]+"' Directory.Build.props \
                | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          test -n "$pin" || { echo "::error::Could not read the SQLitePCLRaw.lib.e_sqlite3 pin from Directory.Build.props."; exit 1; }
          echo "Pinned in Directory.Build.props: $pin"

          found=$(docker run --rm --entrypoint sh shonkor:ci -c \
            'cat /app/Shonkor.Web.deps.json /app/cli/shonkor.deps.json 2>/dev/null' \
            | grep -oE 'SQLitePCLRaw\.lib\.e_sqlite3/[0-9]+\.[0-9]+\.[0-9]+' \
            | cut -d/ -f2 | sort -u)

          test -n "$found" || {
            echo "::error::No SQLitePCLRaw.lib.e_sqlite3 entry in the image's deps.json files. Either the native package stopped being a dependency, or the paths this check reads have moved — both need a human, and neither may pass silently."
            exit 1
          }

          echo "Resolved in the image: $(echo "$found" | tr '\n' ' ')"
          if [ "$found" != "$pin" ]; then
            echo "::error::The image resolved SQLitePCLRaw.lib.e_sqlite3 $(echo "$found" | tr '\n' ' ') but Directory.Build.props pins $pin. The restore inside the image is not seeing the pin (#389)."
            exit 1
          fi
          echo "OK: the image carries the pinned native SQLite ($pin)."

      - name: Smoke — the image really carries the TypeScript plugin, sidecar deps included
        shell: bash
        run: |
          # A green build proves the plugin compiled; it does not prove the artifact inside the image is
          # complete. Seeding is the seam that materialises it: AssemblyPluginLoader.LoadActive(workspace)
          # calls StandardPluginSeeder.EnsureSeeded, which installs the embedded plugin ZIP into the
          # workspace. If the ZIP were missing or its sidecar tree truncated, the pinned typescript would
          # not appear on disk. `shonkor index` is the CLI path through that seam.
          ws="$RUNNER_TEMP/shonkor-smoke"
          mkdir -p "$ws/scan-target"
          # The image runs as UID 1654 (`USER app`), which is not the runner's uid — the bind mount has to
          # be writable by it, or seeding fails and this check would report the wrong cause.
          chmod -R 777 "$ws"
          docker run --rm \
            -v "$ws:/workspace" -w /workspace \
            -e SHONKOR_WORKSPACE=/workspace \
            --entrypoint shonkor shonkor:ci index /workspace/scan-target
          seeded="$ws/plugins/shonkor-typescript/sidecar/node_modules/typescript/package.json"
          test -f "$seeded" || {
            echo "::error::The seeded TypeScript plugin has no sidecar deps ($seeded is missing) — the image would parse JS/TS without the real TS Compiler API."
            exit 1
          }
          echo "OK: $(basename "$seeded") present — sidecar deps shipped in the image."
